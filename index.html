<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活管理儀表板</title>
    <!-- 使用 Google Material Icons 圖示庫 -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .header {
            margin: 40px 0 20px;
        }
        .header h1 {
            font-size: 28px;
            margin: 5px 0;
            color: #333;
        }
        .header p {
            color: #888;
            margin: 0;
        }

        /* 充電設備狀態區（沿用你原本的功能概念） */
        .status-bar {
            background: white;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .status-bar i { color: #4caf50; margin-right: 10px; }

        /* 網格選單 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .menu-item {
            background: white;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-item:active {
            transform: scale(0.95);
        }
        .icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .menu-item span {
            font-weight: bold;
            font-size: 16px;
        }

        /* 顏色區分 */
        .bg-blue { background-color: #e3f2fd; color: #1976d2; }
        .bg-orange { background-color: #fff3e0; color: #f57c00; }
        .bg-yellow { background-color: #fffde7; color: #fbc02d; }
        .bg-teal { background-color: #e0f2f1; color: #00796b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <p>午安，</p>
        <h1>今天想做什麼？</h1>
    </div>

   

    <div class="menu-grid">
        <!-- 行程：月曆 -->
        <a href="#" class="menu-item">
            <div class="icon-circle bg-blue">
                <i class="material-icons-round" style="font-size: 32px;">calendar_month</i>
            </div>
            <span>行程規劃</span>
        </a>

        <!-- 身體狀態：膠囊 -->
        <a href="#" class="menu-item">
            <div class="icon-circle bg-orange">
                <i class="material-icons-round" style="font-size: 32px;">medication</i>
            </div>
            <span>今日紀錄</span>
        </a>

        <!-- 待買商品：一盞燈 -->
        <a href="#" class="menu-item">
            <div class="icon-circle bg-yellow">
                <i class="material-icons-round" style="font-size: 32px;">light</i>
            </div>
            <span>補給清單</span>
        </a>

        <!-- 備註：記事本 -->
        <a href="#" class="menu-item">
            <div class="icon-circle bg-teal">
                <i class="material-icons-round" style="font-size: 32px;">note_alt</i>
            </div>
            <span>事情備註</span>
        </a>
    </div>

    
 <div class="status-bar">
        <i class="material-icons-round">battery_charging_full</i>
        <span>充電設備：3 裝置在線</span>
 </div>



    
</div>

</body>
</html>
