<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTOOL Ticket</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body {
            background-color: #1c1f21; /* 你指定的深黑色 */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 40px 20px;
        }

        /* 門票容器 */
        .ticket {
            width: 100%;
            max-width: 350px;
            background-color: #1c1f21;
            border: 1px solid #333;
            position: relative;
            padding-bottom: 20px;
        }

        /* 門票兩側的圓孔切邊效果 */
        .ticket::before, .ticket::after {
            content: '';
            position: absolute;
            top: 280px; /* 切點位置在圖片下方 */
            width: 30px;
            height: 30px;
            background-color: #1c1f21;
            border-radius: 50%;
            z-index: 10;
        }
        .ticket::before { left: -15px; border-right: 1px solid #333; }
        .ticket::after { right: -15px; border-left: 1px solid #333; }

        /* 上方自訂圖片區 */
        .ticket-image {
            width: 100%;
            height: 300px;
            background-color: #333;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px dashed #444; /* 撕線效果 */
        }
        .ticket-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%); /* 讓圖片自動變黑白，增加質感 */
        }

        /* 按鈕網格區 */
        .nav-content {
            padding: 30px 20px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .nav-card {
            background-color: #2a2d2f; /* 深灰色按鈕 */
            border: 1px solid #444;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-card:active {
            background-color: #ffffff;
            color: #1c1f21;
        }

        .nav-card i {
            font-size: 28px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .nav-card span {
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 底部裝飾（條碼感） */
        .footer {
            margin-top: 30px;
            text-align: center;
            opacity: 0.5;
            font-size: 10px;
            letter-spacing: 5px;
        }
        .barcode {
            width: 150px;
            height: 30px;
            margin: 10px auto;
            border-bottom: 1px solid #fff;
            background: repeating-linear-gradient(90deg, #fff, #fff 1px, transparent 1px, transparent 4px);
        }
    </style>
</head>
<body>

<div class="ticket">
    <div class="ticket-image">
        <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop" alt="Ticket Visual">
    </div>

    <div class="nav-content">
        <div class="nav-grid">
            <a href="schedule.html" class="nav-card">
                <i class="material-icons-round">calendar_today</i>
                <span>Schedule</span>
            </a>
            <a href="record.html" class="nav-card">
                <i class="material-icons-round">fiber_manual_record</i>
                <span>Daily Log</span>
            </a>
            <a href="shopping.html" class="nav-card">
                <i class="material-icons-round">lightbulb</i>
                <span>Wishlist</span>
            </a>
            <a href="notes.html" class="nav-card">
                <i class="material-icons-round">short_text</i>
                <span>Notes</span>
            </a>
        </div>

        <div class="footer">
            <div class="barcode"></div>
            MTOOL - 2026 PERSONAL ACCESS
        </div>
    </div>
</div>

</body>
</html>
